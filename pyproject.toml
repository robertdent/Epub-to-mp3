[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epub2mp3"
version = "0.1.0"
description = "Convert EPUB files to chapter-based MP3 audiobooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "piper-tts>=1.2.0",
    "requests>=2.31.0",
]

[project.scripts]
epub2mp3 = "epub2mp3.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epub2mp3 = ["py.typed"]
